# Minimal proxychains4 config for this lab. dynamic_chain + a single
# proxy entry pointed at wherever your chisel reverse SOCKS proxy ends
# up listening (127.0.0.1:1080 is chisel's default for an `R:socks`
# remote - see solutions/SOLUTION_W11.md if yours differs).
dynamic_chain
proxy_dns
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
socks5 127.0.0.1 1080
