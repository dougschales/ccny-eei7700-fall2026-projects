PasswordAuthentication yes
PermitRootLogin no
UsePAM yes

# Deliberate lab constraint: interactive login, scp/sftp, and exec all
# still work, but the SSH client's own -D/-L/-R tunnelling is refused
# ("administratively prohibited"). A real admin might set this to stop
# staff from using the box as an informal SOCKS jump point; here it
# exists to push you toward chisel instead of plain SSH port forwarding.
AllowTcpForwarding no
PermitTunnel no
