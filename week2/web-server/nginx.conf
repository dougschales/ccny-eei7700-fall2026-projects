events {}

http {
    # Default server block - catches everything not matching dev.target.local
    server {
        listen 80 default_server;
        server_name _;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }

    # Development server block - only accessible via dev.target.local
    server {
        listen 80;
        server_name dev.target.local;
        
        location / {
            root /usr/share/nginx/html;
            index dev.html;
        }
    }
}
