[global]
    workgroup = WORKGROUP
    server string = CyberCorp File Server
    netbios name = TARGET
    security = user
    map to guest = Bad User
    guest account = nobody
    server min protocol = SMB2
    server smb encrypt = disabled
    log file = /var/log/samba/log.%m
    max log size = 50
    dns proxy = no

[public]
    path = /srv/smb/public
    comment = CyberCorp Public Backups
    browseable = yes
    guest ok = yes
    guest only = yes
    read only = yes
    force user = nobody
