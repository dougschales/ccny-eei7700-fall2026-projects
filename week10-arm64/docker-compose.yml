version: '3.8'

# arm64 variant - for Apple Silicon Macs. See ../week10/ for the
# x86_64 variant (Intel/AMD Linux, Windows/WSL2, Intel Macs) and
# ../week10-ubuntu22-script/ for stock Ubuntu 22.04. The vulnerable
# statusd/diagtool binaries are compiled inside the target container at
# startup (see target/entrypoint.sh), so `platform` here just pins
# podman to build/run as aarch64, matching a Mac's own Apple Silicon
# CPU - no QEMU emulation involved, this runs native.
#
# The exploit mechanics (registers, calling convention, shellcode) are
# different on aarch64 than x86_64 - see Week10_Project/slides.html and
# solutions/SOLUTION_W10.md for the aarch64 track. Unlike the other two
# variants, this one has not been exploited end-to-end against real
# Apple Silicon hardware - see the note in this directory's README.

services:
  target:
    build:
      context: ./target
    platform: linux/arm64
    container_name: week10_target
    hostname: target
    restart: unless-stopped
    init: true
    # Default seccomp profiles block personality(2), which statusd-launch
    # and the diagtool privesc step both use (via `setarch -R`) to
    # disable ASLR for just that one process - see entrypoint.sh for why
    # that one syscall is opened up instead of writing
    # /proc/sys/kernel/randomize_va_space.
    security_opt:
      - seccomp=unconfined
    # SYS_PTRACE: the documented measurement technique ("attach gdb to a
    # connection you're holding open") is a root->svc ptrace, which needs
    # CAP_SYS_PTRACE even inside the container - without it gdb -p fails
    # with "Could not attach... Inappropriate ioctl for device."
    cap_add:
      - SYS_PTRACE
    networks:
      week10_net:
        ipv4_address: 172.40.0.10

  student:
    build:
      context: ./student
    platform: linux/arm64
    container_name: week10_student
    hostname: student
    restart: unless-stopped
    init: true
    # SYS_PTRACE: gdb can't actually run or attach to any process without
    # this (default container capabilities + seccomp block ptrace(2)
    # outright) - needed to debug a locally-run copy of the leaked
    # statusd binary, not just to disassemble it statically.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    networks:
      week10_net:
        ipv4_address: 172.40.0.5
    depends_on:
      - target
    stdin_open: true
    tty: true

networks:
  week10_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24
