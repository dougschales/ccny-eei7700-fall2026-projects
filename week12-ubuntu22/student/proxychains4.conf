# proxychains4 config for this lab. dynamic_chain + a single proxy entry
# pointed at wherever your first chisel reverse SOCKS proxy ends up
# listening (127.0.0.1:1080 is chisel's default for an `R:socks` remote).
#
# The capstone's final stage needs a SECOND hop chained after this one -
# proxychains supports listing more than one proxy under [ProxyList] and
# will chain through them in order. See solutions/README_W12.md's final
# objective for what to add.
dynamic_chain
proxy_dns
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
socks5 127.0.0.1 1080
